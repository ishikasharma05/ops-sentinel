global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "ops-sentinel-alertmanager:9093"

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "ops-sentinel"
    static_configs:
      - targets: ["host.docker.internal:8000"]
